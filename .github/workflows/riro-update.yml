name: 생기부 활동 자동 수집

# 매일 07:30 KST (= 22:30 UTC 전날) 실행. 저장소 data/activities.json 수집일이 3일 지났을 때만 실제 수집.
# 리로스쿨 계정은 저장소 Settings → Secrets and variables → Actions 의 RIRO_ID / RIRO_PW 에만 둔다. 로그에는 자동으로 가려진다.
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "3일이 안 지났어도 지금 수집"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: riro-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/riro-notifier/scraper/requirements.txt
      - name: 의존성 설치
        run: |
          pip install -r tools/riro-notifier/scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: 수집 → 실명 제거 → 커밋
        env:
          RIRO_ID: ${{ secrets.RIRO_ID }}
          RIRO_PW: ${{ secrets.RIRO_PW }}
          JUNGSAN_DIR: ${{ github.workspace }}/tools/riro-notifier
        run: |
          test -n "$RIRO_ID" || { echo "::error::RIRO_ID / RIRO_PW 시크릿이 없습니다"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/riro-notifier/auto_update.py --no-push ${{ inputs.force && '--force' || '' }}
      - name: push
        run: |
          git pull --rebase -q origin main || true
          git push origin HEAD:main
