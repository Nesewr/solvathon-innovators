name: 생기부 활동 자동 수집

# 주의: 리로스쿨이 해외 IP 접속을 차단해 GitHub 서버(해외)에서는 수집이 실패한다.
# 그래서 자동 실행(schedule)은 끄고 수동 실행만 남겨 둔다. 실제 자동 수집은 한국에 있는 팀원 맥에서
# tools/riro-notifier/install_schedule.sh (launchd, 매일 07:30) 로 돌린다.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "3일이 안 지났어도 지금 수집"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: riro-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/riro-notifier/scraper/requirements.txt
      - name: 의존성 설치
        run: |
          pip install -r tools/riro-notifier/scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: 수집 → 실명 제거 → 커밋
        env:
          RIRO_ID: ${{ secrets.RIRO_ID }}
          RIRO_PW: ${{ secrets.RIRO_PW }}
          JUNGSAN_DIR: ${{ github.workspace }}/tools/riro-notifier
        run: |
          test -n "$RIRO_ID" || { echo "::error::RIRO_ID / RIRO_PW 시크릿이 없습니다"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          python tools/riro-notifier/auto_update.py --no-push ${{ inputs.force && '--force' || '' }}
          code=$?
          set -e
          echo "::group::auto_update.log"; cat tools/riro-notifier/data/auto_update.log 2>/dev/null || true; echo "::endgroup::"
          if [ $code -ne 0 ]; then
            last=$(grep -E "FAIL|실패|없음" tools/riro-notifier/data/auto_update.log 2>/dev/null | tail -1)
            echo "::error title=수집 실패::${last:-auto_update.py exit $code}"
            exit $code
          fi
      - name: push
        run: |
          git pull --rebase -q origin main || true
          git push origin HEAD:main
