name: 서버 깨우기

# Render 무료 서버는 15분 비활성 시 잠든다. 10분마다 health 를 호출해 깨어 있게 한다 (월 750시간 무료 한도 내).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://solvathon-innovators.onrender.com/api/health > /dev/null && echo "awake"
