<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중산고 생기부 활동 알리미</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
  :root {
    --bg: #f7f5ef; --paper: #ffffff; --ink: #1e2a25; --ink-2: #5a6660; --line: #dcd8cd;
    --accent: #1d6b4f; --accent-ink: #ffffff; --accent-soft: #e2efe8;
    --urgent: #b3402a; --urgent-soft: #f8e3dd; --closed: #8a908c; --gold: #8a6d1f; --gold-soft: #f6efd7;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161a18; --paper: #1f2522; --ink: #ecefea; --ink-2: #a3aca6; --line: #333b37;
      --accent: #5fbf95; --accent-ink: #0f1a15; --accent-soft: #23352d;
      --urgent: #ef8a72; --urgent-soft: #3d2620; --closed: #7d857f; --gold: #e0c068; --gold-soft: #3a3320; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161a18; --paper: #1f2522; --ink: #ecefea; --ink-2: #a3aca6; --line: #333b37;
    --accent: #5fbf95; --accent-ink: #0f1a15; --accent-soft: #23352d;
    --urgent: #ef8a72; --urgent-soft: #3d2620; --closed: #7d857f; --gold: #e0c068; --gold-soft: #3a3320; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 960px; margin: 0 auto; padding-block: 32px 64px; padding-inline: 16px; }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 16px; margin-bottom: 20px; }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
  h1 { font-family: "Nanum Myeongjo", serif; font-size: clamp(26px, 5vw, 38px); margin: 4px 0 6px; text-wrap: balance; }
  .sub { color: var(--ink-2); margin: 0; }
  .note { background: var(--urgent-soft); color: var(--urgent); padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
  .note.info { background: var(--gold-soft); color: var(--gold); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
  .controls input[type=search] { flex: 1 1 200px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip:focus-visible, .controls input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .count { color: var(--ink-2); font-size: 13px; margin-bottom: 12px; }
  .list { display: grid; gap: 12px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 14px 16px; display: grid; gap: 6px; }
  .card.urgent { border-left-color: var(--urgent); }
  .card.closed { border-left-color: var(--closed); opacity: .75; }
  .card.no { border-left-color: var(--line); opacity: .6; }
  .card .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-size: 13px; color: var(--ink-2); }
  .card .top .cat { color: var(--accent); font-weight: 600; }
  .card.urgent .top .dday { color: var(--urgent); font-weight: 700; }
  .card h2 { margin: 0; font-size: 17px; line-height: 1.4; }
  .card h2 a { color: inherit; text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .card p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .ai { display: grid; gap: 4px; padding: 8px 10px; border-radius: 6px; background: var(--gold-soft); font-size: 13px; }
  .ai .verdict { font-weight: 700; color: var(--gold); }
  .card.no .ai { background: transparent; border: 1px dashed var(--line); }
  .card.no .ai .verdict { color: var(--ink-2); }
  .ai .tip::before { content: "팁 "; font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 4px; }
  .tag.grade { background: transparent; border: 1px solid var(--line); color: var(--ink-2); }
  .courses { font-size: 13px; color: var(--ink-2); }
  .courses summary { cursor: pointer; }
  .courses ul { margin: 6px 0 0; padding-left: 18px; }
  .runbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
  .btn.ghost[data-armed="1"] { color: var(--urgent); border-color: var(--urgent); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .runstat { font-size: 13px; color: var(--ink-2); }
  .runlog { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-height: 140px; overflow: auto; white-space: pre-wrap; color: var(--ink-2); }
  .newbox { background: var(--accent-soft); color: var(--accent); padding: 10px 14px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
  .newbox ul { margin: 6px 0 0; padding-left: 18px; }
  .empty { text-align: center; color: var(--ink-2); padding: 48px 0; }
  .num { font-variant-numeric: tabular-nums; }
  footer { margin-top: 40px; font-size: 12px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">서울 중산고등학교 · 리로스쿨</div>
    <h1>생기부 활동 알리미</h1>
    <p class="sub">리로스쿨 공지사항, 가정통신문, 신청게시판, 경시대회에서 참여하면 생기부에 남는 활동만 골라 마감 순으로 보여줍니다.</p>
  </header>

  <div class="runbar">
    <button id="runBtn" class="btn" type="button">리로스쿨 분석하기</button>
    <button id="resetBtn" class="btn ghost" type="button">데이터 초기화</button>
    <span id="runStat" class="runstat">버튼을 누르면 리로스쿨에 자동 로그인해 새 글을 모으고 AI가 생기부 이득 여부를 판정합니다. 1~3분 걸려요.</span>
  </div>
  <div id="runLog" class="runlog" hidden></div>
  <div id="newBox" class="newbox" hidden></div>
  <div id="note" class="note" hidden></div>

  <div class="controls">
    <input id="q" type="search" placeholder="제목이나 내용으로 검색" aria-label="검색">
    <div class="chips" id="gradeChips" role="group" aria-label="학년">
      <button class="chip" data-grade="1" aria-pressed="true">1학년</button>
      <button class="chip" data-grade="2" aria-pressed="false">2학년</button>
      <button class="chip" data-grade="3" aria-pressed="false">3학년</button>
    </div>
    <div class="chips" id="catChips" role="group" aria-label="활동 종류"></div>
    <label class="chip"><input id="onlyWorth" type="checkbox" checked> AI가 이득이라고 본 것만</label>
    <label class="chip"><input id="showClosed" type="checkbox"> 마감 지난 것도 보기</label>
  </div>

  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
  <footer id="foot"></footer>
</div>

<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  let data;
  try {
    const r = await fetch("../data/activities.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    data = { activities: [], empty: true };
    $("#note").hidden = false; $("#note").className = "note info";
    $("#note").textContent = "아직 데이터가 없습니다. 위의 '리로스쿨 분석하기'를 누르면 수집과 AI 판정이 시작됩니다.";
  }
  const acts = data.activities || [];
  const hasAI = acts.some(a => a.ai);
  if (data.empty) {}
  else if (data.sample) { $("#note").hidden = false; $("#note").textContent = "예시 데이터입니다. scraper 를 실행하면 실제 리로스쿨 글로 바뀝니다."; }
  else if (!hasAI) { $("#note").hidden = false; $("#note").className = "note info"; $("#note").textContent = "아직 AI 판정 전이라 키워드로만 걸러진 목록입니다. .env 에 API 키를 넣고 python3 scraper/llm_filter.py 를 실행하면 '진짜 생기부에 이득인 것'만 남습니다."; }
  if (!hasAI) { $("#onlyWorth").checked = false; $("#onlyWorth").parentElement.hidden = true; }

  const today = new Date(); today.setHours(0,0,0,0);
  const cats = [...new Set(acts.map(a => a.category))];
  const catBox = $("#catChips");
  for (const c of cats) { const b = document.createElement("button"); b.className = "chip"; b.textContent = c; b.dataset.cat = c; b.setAttribute("aria-pressed", "false"); catBox.appendChild(b); }
  const state = { grade: "1", cat: null, q: "", closed: false, onlyWorth: hasAI };
  try { const g = localStorage.getItem("grade"); if (g) state.grade = g; } catch (e) {}
  document.querySelectorAll("#gradeChips .chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.grade === state.grade)));

  const dday = a => a.deadline ? Math.round((new Date(a.deadline + "T00:00:00") - today) / 86400000) : null;
  const isClosed = a => { const d = dday(a); return (d !== null && d < 0) || a.status === "마감"; };
  const fmt = iso => { if (!iso) return ""; const [y,m,d] = iso.split("-"); return `${m}/${d}`; };
  // 앞으로 열려 있는 게 하나도 없으면 지난 활동을 기본으로 보여준다
  if (!acts.some(a => !isClosed(a))) { state.closed = true; $("#showClosed").checked = true; }

  function render() {
    const q = state.q.trim().toLowerCase(), g = Number(state.grade);
    const rows = acts.filter(a => {
      if (a.grades && a.grades.length && !a.grades.includes(g)) return false;
      if (state.cat && !(a.categories || [a.category]).includes(state.cat)) return false;
      if (q && !(a.title + " " + (a.summary || "") + " " + (a.ai?.reason || "")).toLowerCase().includes(q)) return false;
      if (state.onlyWorth && a.ai && !a.ai.worth) return false;
      if (!state.closed && isClosed(a)) return false;
      return true;
    });
    $("#count").textContent = `${rows.length}개 활동`;
    const list = $("#list"); list.innerHTML = "";
    if (!rows.length) { list.innerHTML = '<div class="empty">조건에 맞는 활동이 없습니다.</div>'; return; }
    for (const a of rows) {
      const dd = dday(a), closed = isClosed(a);
      const card = document.createElement("article");
      card.className = "card" + (a.ai && !a.ai.worth ? " no" : closed ? " closed" : dd !== null && dd <= 3 ? " urgent" : "");
      const ddText = closed ? "마감됨" : dd === null ? "마감일 미정" : dd === 0 ? "오늘 마감" : `D-${dd}`;
      const grades = (a.grades && a.grades.length ? a.grades : [1,2,3]).map(n => n + "학년").join(" · ");
      const records = a.ai?.record?.length ? a.ai.record : (a.record || []);
      card.innerHTML = `
        <div class="top">
          <span class="cat"></span>
          <span class="dday num">${ddText}${a.deadline ? " (" + fmt(a.deadline) + ")" : ""}</span>
          ${a.posted ? `<span class="num">게시 ${fmt(a.posted)}</span>` : ""}
          <span class="board"></span>
        </div>
        <h2><a target="_blank" rel="noopener"></a></h2>
        <p class="summary"></p>
        <div class="tags">${records.map(r => `<span class="tag">${r}</span>`).join("")}<span class="tag grade">${grades}</span></div>`;
      card.querySelector(".cat").textContent = a.category;
      card.querySelector(".board").textContent = a.board || "";
      const link = card.querySelector("h2 a"); link.textContent = a.title; link.href = a.url || "#";
      card.querySelector(".summary").textContent = a.summary || a.info || "";
      if (a.ai) {
        const box = document.createElement("div"); box.className = "ai";
        const v = document.createElement("div"); v.className = "verdict";
        v.textContent = a.ai.worth ? `생기부 이득 · ${a.ai.score}점` : "생기부 기록 안 됨";
        const r = document.createElement("div"); r.textContent = a.ai.reason || "";
        box.append(v, r);
        if (a.ai.tip) { const t = document.createElement("div"); t.className = "tip"; t.textContent = a.ai.tip; box.appendChild(t); }
        card.appendChild(box);
      }
      if (a.courses && a.courses.length) {
        const det = document.createElement("details"); det.className = "courses";
        det.innerHTML = `<summary>세부 강좌 ${a.courses.length}개</summary><ul></ul>`;
        const ul = det.querySelector("ul");
        for (const c of a.courses) {
          const li = document.createElement("li");
          const name = c["강좌 이름"] || Object.values(c).find(v => v && v.length > 2 && !/^\d/.test(v)) || "";
          li.textContent = `${name}${c["학년"] ? " (" + c["학년"] + "학년)" : ""}${c["담당교사"] ? " · " + c["담당교사"] : ""}${c["신청/정원"] ? " · " + c["신청/정원"] : ""}${c.status ? " · " + c.status : ""}`;
          ul.appendChild(li);
        }
        card.appendChild(det);
      }
      list.appendChild(card);
    }
  }

  $("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
  $("#showClosed").addEventListener("change", e => { state.closed = e.target.checked; render(); });
  $("#onlyWorth").addEventListener("change", e => { state.onlyWorth = e.target.checked; render(); });
  document.querySelectorAll("#gradeChips .chip").forEach(b => b.addEventListener("click", () => {
    state.grade = b.dataset.grade;
    try { localStorage.setItem("grade", state.grade); } catch (e) {}
    document.querySelectorAll("#gradeChips .chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  }));
  catBox.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    state.cat = state.cat === b.dataset.cat ? null : b.dataset.cat;
    catBox.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.cat === state.cat)));
    render();
  });
  $("#foot").textContent = `마지막 수집: ${data.generated || "-"} · 전체 ${acts.length}개` + (hasAI ? ` · AI 판정 ${data.ai_judged}개 (${data.ai_model})` : "");
  render();

  // ---- 분석하기 버튼: 서버(scraper/server.py)에 실행을 요청하고 진행 상황을 보여준다 ----
  const btn = $("#runBtn"), stat = $("#runStat"), logBox = $("#runLog"), newBox = $("#newBox");
  async function showNew() {
    try {
      const r = await fetch("../data/new_activities.json", { cache: "no-store" });
      if (!r.ok) return;
      const n = await r.json();
      if (!n.activities?.length) return;
      newBox.hidden = false;
      newBox.innerHTML = `<strong>새로 올라온 생기부 이득 활동 ${n.activities.length}건</strong> (${n.found.replace("T", " ")})<ul></ul>`;
      const ul = newBox.querySelector("ul");
      for (const a of n.activities) { const li = document.createElement("li"); li.textContent = a.title + (a.deadline ? ` (마감 ${a.deadline})` : ""); ul.appendChild(li); }
    } catch (e) {}
  }
  showNew();
  async function poll() {
    let st;
    try { st = await (await fetch("/api/status", { cache: "no-store" })).json(); }
    catch (e) { stat.textContent = "서버와 연결이 끊겼습니다. python3 scraper/server.py 를 실행해 주세요."; btn.disabled = false; return; }
    logBox.hidden = !st.log.length; logBox.textContent = st.log.join("\n"); logBox.scrollTop = logBox.scrollHeight;
    if (st.running) { stat.textContent = "분석 중... 창을 닫지 마세요."; setTimeout(poll, 2000); return; }
    btn.disabled = false;
    stat.textContent = st.ok ? `분석 완료 (${st.finished}). 목록을 새로 불러옵니다.` : `분석 실패 (${st.finished}). 아래 기록을 확인하세요.`;
    if (st.ok) setTimeout(() => location.reload(), 1200);
  }
  btn.addEventListener("click", async () => {
    btn.disabled = true; stat.textContent = "시작하는 중...";
    try {
      const r = await (await fetch("/api/run", { method: "POST" })).json();
      if (!r.started && r.reason !== "already running") throw new Error(r.reason || "시작 실패");
    } catch (e) { stat.textContent = "서버가 없습니다. 터미널에서 python3 scraper/server.py 를 먼저 실행하세요."; btn.disabled = false; return; }
    poll();
  });
  const resetBtn = $("#resetBtn"); let armTimer = null;
  resetBtn.addEventListener("click", async () => {
    if (resetBtn.dataset.armed !== "1") {
      resetBtn.dataset.armed = "1"; resetBtn.textContent = "정말 초기화? (다시 누르면 실행)";
      armTimer = setTimeout(() => { resetBtn.dataset.armed = "0"; resetBtn.textContent = "데이터 초기화"; }, 3000);
      return;
    }
    clearTimeout(armTimer); resetBtn.disabled = true; resetBtn.textContent = "초기화 중...";
    try {
      const r = await (await fetch("/api/reset", { method: "POST" })).json();
      if (!r.ok) throw new Error(r.reason || "실패");
      stat.textContent = "초기화 완료. 데이터는 data/backup_ 폴더에 보관됐습니다. 이제 '리로스쿨 분석하기'를 누르면 처음부터 시연할 수 있어요.";
      setTimeout(() => location.reload(), 1500);
    } catch (e) {
      stat.textContent = "초기화 실패: " + e.message; resetBtn.disabled = false; resetBtn.dataset.armed = "0"; resetBtn.textContent = "데이터 초기화";
    }
  });
  // 페이지를 열었을 때 이미 돌고 있으면 이어서 보여준다
  fetch("/api/status", { cache: "no-store" }).then(r => r.json()).then(st => {
    if (st.running) { btn.disabled = true; poll(); }
    else if (st.finished) stat.textContent = st.ok ? `마지막 분석 ${st.finished} 완료. 다시 누르면 새 글을 확인합니다.` : `마지막 분석(${st.finished}) 실패. data/run.log 를 확인하세요.`;
  }).catch(() => {});
})();
</script>
</body>
</html>
